<title>OtterApply Landing Page</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one centered column. Logo lockup, typed line, button, quiet footnote. The glow behind the otter is the only loud thing. */
:root{
  --bg:#f7f5ff; --bg2:#ffffff; --ink:#17133a; --ink2:#5d5887; --line:#e3dff6; --t1:#7c5cf0; --t2:#4f6bf0; --t3:#0c9e8e;
  --peach:#ffc59a; --lav:#a49dff; --teal:#46dccb;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root{--g1:rgba(164,157,255,.30);--g2:rgba(70,220,203,.20);--g3:rgba(190,170,255,.32);--shadow:rgba(76,60,190,.28);--btn:linear-gradient(100deg,#c9c2ff,#b9ccff 52%,#6fe3d2);--btnglow:rgba(106,92,240,.32)}
:root[data-look="midnight"]{--bg:#0c0a22;--bg2:#15122e;--ink:#f4f2ff;--ink2:#a9a4d0;--line:#2a2650;--t1:#ffc59a;--t2:#a49dff;--t3:#46dccb;--g1:rgba(164,157,255,.28);--g2:rgba(70,220,203,.14);--g3:rgba(255,197,154,.13);--shadow:rgba(164,157,255,.45);--btnglow:rgba(164,157,255,.45);color-scheme:dark}
:root[data-look="seafoam"]{--bg:#eefaf8;--bg2:#fff;--ink:#0c2e32;--ink2:#4a7176;--line:#cfeae6;--t1:#0a9a8a;--t2:#2c7be5;--t3:#6a5cf0;--g1:rgba(70,220,203,.32);--g2:rgba(120,190,255,.24);--g3:rgba(164,157,255,.22);--shadow:rgba(12,120,120,.28);--btn:linear-gradient(100deg,#7fe9da,#a9d6ff 55%,#cfc9ff);--btnglow:rgba(20,150,150,.32)}
:root[data-look="blush"]{--bg:#fff5f2;--bg2:#fff;--ink:#2b1233;--ink2:#7b5a80;--line:#f4dde0;--t1:#f0703a;--t2:#d6409f;--t3:#7a4cf0;--g1:rgba(255,150,175,.28);--g2:rgba(255,197,154,.34);--g3:rgba(164,157,255,.22);--shadow:rgba(190,60,120,.26);--btn:linear-gradient(100deg,#ffc59a,#ffb3cf 52%,#cfc2ff);--btnglow:rgba(214,64,159,.30)}
.themes{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:5;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:calc(100% - 32px)}
.themes button{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--ink2);font:600 13px/1 var(--body);cursor:pointer}
.themes button i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:block}
.themes button[aria-pressed="true"]{color:var(--ink);border-color:var(--t2);box-shadow:0 0 0 2px var(--t2) inset}
.themes button:focus-visible{outline:2px solid var(--t2);outline-offset:2px}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);overflow-x:hidden}
.page{position:relative;min-height:calc(100vh - 2px);display:flex;flex-direction:column;align-items:center;justify-content:center;isolation:isolate;
  padding-block:72px 140px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
/* atmosphere */
.glow{position:absolute;inset:0;z-index:-2;pointer-events:none;
  background:
   radial-gradient(560px 380px at 50% 26%,var(--g1),transparent 70%),
   radial-gradient(440px 330px at 16% 80%,var(--g2),transparent 70%),
   radial-gradient(480px 350px at 86% 72%,var(--g3),transparent 70%)}
.grid{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 20%,transparent 75%)}
.lockup{display:flex;align-items:center;gap:clamp(10px,2.4vw,20px)}
.lockup svg{width:clamp(84px,17vw,132px);height:auto;flex:none;filter:drop-shadow(0 16px 30px var(--shadow))}
.word{font-family:var(--display);font-weight:800;letter-spacing:-.035em;line-height:1;font-size:clamp(40px,9vw,84px);margin:0}
.type{margin:clamp(28px,5vw,44px) 0 0;min-height:1.3em;font-family:var(--display);font-weight:700;letter-spacing:-.02em;
  font-size:clamp(24px,4.6vw,42px);line-height:1.2;text-align:center;
  background:linear-gradient(90deg,var(--t1),var(--t2) 55%,var(--t3));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.caret{display:inline-block;width:.08em;height:.95em;margin-left:.08em;vertical-align:-.08em;background:var(--t2);border-radius:2px;animation:blink 1s steps(1) infinite;-webkit-text-fill-color:initial}
@keyframes blink{50%{opacity:0}}
.cta{margin-top:clamp(28px,5vw,44px);display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 34px;border:0;border-radius:999px;cursor:pointer;
  font:700 18px/1 var(--display);letter-spacing:-.01em;color:#16123a;text-decoration:none;
  background:var(--btn);
  box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 10px 30px var(--btnglow);transition:transform .18s ease,box-shadow .18s ease}
.cta:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.35) inset,0 16px 40px rgba(106,92,240,.42)}
.cta:active{transform:translateY(0)}
.cta:focus-visible{outline:3px solid var(--t2);outline-offset:4px}
.price{margin:18px 0 0;color:var(--ink2);font-size:15px;text-align:center}
.price strong{color:var(--ink);font-weight:600}
.foot{position:absolute;left:max(20px,env(safe-area-inset-left,0px));right:max(20px,env(safe-area-inset-right,0px));bottom:0;padding-block:24px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink2);font-size:14px;border-top:1px solid var(--line)}
.foot nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 28px}
.foot a{color:var(--ink2);text-decoration:none;padding:4px 2px;border-radius:4px;transition:color .15s}
.foot a:hover{color:var(--ink)}
.foot a:focus-visible{outline:2px solid var(--lav);outline-offset:3px}
.foot small{font-size:13px;opacity:.8}
.static{display:none}
.otter-blink{animation:eye 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes eye{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@media (prefers-reduced-motion:reduce){
  .caret,.otter-blink{animation:none}
  .cta{transition:none}
}
</style>

<script>
(function(){
  var lines=["Search for open jobs","Tailor resumes and cover letters","Beat ATS screeners","Autofill applications","Track and manage applications"];
  var el=document.getElementById("t");
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){ // still page: show all four lines
    var p=document.getElementById("type");p.innerHTML=lines.join("<br>");return;
  }
  var li=0,ci=lines[0].length,del=true,wait=0;
  // start from the full first line (visible at rest), hold, then erase and cycle
  function tick(){
    var s=lines[li],d=70;
    if(wait>0){wait--;return setTimeout(tick,60);}
    if(!del){
      ci++;el.textContent=s.slice(0,ci);
      if(ci>=s.length){del=true;wait=22;}
      d=55+Math.random()*45;
    }else{
      if(ci<=0){del=false;li=(li+1)%lines.length;wait=4;d=60;}
      else{ci--;el.textContent=s.slice(0,ci);d=28;}
    }
    setTimeout(tick,d);
  }
  wait=30;setTimeout(tick,60);
})();
(function(){
  var btns=document.querySelectorAll(".themes button");
  function set(n){document.documentElement.setAttribute("data-look",n);for(var i=0;i<btns.length;i++)btns[i].setAttribute("aria-pressed",btns[i].dataset.t===n?"true":"false");}
  for(var i=0;i<btns.length;i++)btns[i].addEventListener("click",function(){set(this.dataset.t);});
})();
</script>
