<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OtterApply</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1c1b3a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .status {
        font-weight: 600;
      }
      .status.paused {
        color: #64748b;
      }
      .status.active {
        color: #059669;
      }
      button {
        border: none;
        border-radius: 999px;
        padding: 9px 16px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      .primary {
        background: linear-gradient(#7f7bff, #5b57f5);
        color: white;
        box-shadow: 0 6px 18px -4px rgba(91, 87, 245, 0.45);
      }
      .link {
        background: none;
        color: #4a45e0;
        box-shadow: none;
        font-weight: 600;
        padding: 0;
        text-decoration: underline;
        font-size: 12px;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        margin-bottom: 8px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
      }
      #pairingSection,
      #mainSection,
      #grabSection {
        display: none;
      }
      #error {
        color: #dc2626;
        font-size: 12px;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <h1>OtterApply</h1>

    <div id="pairingSection">
      <p style="font-size: 12px; color: #64748b">
        Not paired. Generate a code from the dashboard's "Pair Extension" page and paste it
        below.
      </p>
      <input type="text" id="pairingSecretInput" placeholder="Pairing code" />
      <button class="primary" id="pairButton">Pair</button>
    </div>

    <div id="grabSection">
      <div style="font-weight: 800; font-size: 14px; margin-bottom: 4px">Add this job's description to OtterApply</div>
      <div id="grabTitle" style="font-size: 12px; color: #8f8ea8; margin-bottom: 14px"></div>
      <button class="primary" id="grabButton" style="width: 100%">Save job</button>
    </div>

    <div id="mainSection">
      <div class="row">
        <span>Status</span>
        <span class="status" id="statusText">…</span>
      </div>
      <div class="row">
        <span>Needs Attention</span>
        <span id="needsAttentionCount">0</span>
      </div>
      <div class="row">
        <button class="primary" id="toggleButton">…</button>
      </div>
      <div class="row">
        <button class="primary" id="saveJobButton" style="width: 100%">Save this job</button>
      </div>
      <div class="row" style="margin-bottom: 4px">
        <button class="primary" id="fillButton" style="width: 100%">Fill this application</button>
      </div>
      <div id="fillChoices" style="display: none; margin-bottom: 8px">
        <select id="fillChoiceSelect" style="width: 100%; margin-bottom: 6px"></select>
        <button class="primary" id="fillChoiceButton" style="width: 100%">Use this job</button>
      </div>
      <div id="fillResult" style="font-size: 12px; margin-bottom: 8px"></div>
      <div id="captureStatus" style="font-size: 12px; color: #059669; margin-bottom: 6px"></div>
      <button class="link" id="openDashboardButton">Open Dashboard</button>
    </div>

    <div id="error"></div>

    <script src="popup.js"></script>
  </body>
</html>
