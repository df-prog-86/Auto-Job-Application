<!doctype html><html><head><meta charset="utf-8"><title>CC-305</title></head><body>
<h2>Self Identify</h2><h3>Voluntary Self-Identification of Disability</h3>
<form id="app">
  <div><label id="ll" for="lang">Language<abbr>*</abbr></label><button id="lang" type="button" aria-haspopup="listbox" aria-label="Language English Required">English</button></div>
  <div><label for="nm">Name<abbr title="required">*</abbr></label><input id="nm" type="text" aria-required="true"></div>
  <div><label for="dt">Date<abbr title="required">*</abbr></label><input id="dt" type="text" aria-required="true"></div>
  <fieldset><legend>Please check one of the boxes below:*</legend>
    <label><input type="checkbox" id="c1"> Yes, I have a disability, or have had one in the past</label>
    <label><input type="checkbox" id="c2"> No, I do not have a disability</label></fieldset>
  <button type="button" id="next" data-automation-id="pageFooterNextButton">Save and Continue</button>
</form></body></html>
