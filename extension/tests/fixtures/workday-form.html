<!doctype html><html><head><meta charset="utf-8"><title>Workday fixture</title></head><body>
<form id="app" data-automation-id="applyFlowPage">
  <div data-automation-id="formField-legalNameSection_firstName"><label for="fn">First Name<abbr title="required">*</abbr></label>
    <input id="fn" type="text" data-automation-id="legalNameSection_firstName" aria-required="true"></div>
  <div><label for="ln">Last Name<abbr title="required">*</abbr></label>
    <input id="ln" type="text" data-automation-id="legalNameSection_lastName" aria-required="true"></div>
  <div><label for="em">Email Address</label><input id="em" type="text" data-automation-id="email"></div>
  <div><label id="dtl" for="pdt">Phone Device Type<abbr title="required">*</abbr></label>
    <button id="pdt" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="dtl" data-automation-id="phone-device-type">Select One</button></div>
  <div><label id="cpl" for="cpc">Country Phone Code<abbr title="required">*</abbr></label>
    <button id="cpc" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="cpl" data-automation-id="countryPhoneCode">Select One</button></div>
  <div><label for="a1">Address Line 1<abbr title="required">*</abbr></label><input id="a1" type="text" aria-required="true"></div>
  <div><label for="a2">Address Line 2</label><input id="a2" type="text"></div>
  <div><label for="ct">City<abbr title="required">*</abbr></label><input id="ct" type="text" aria-required="true"></div>
  <div><label for="pc">Postal Code<abbr title="required">*</abbr></label><input id="pc" type="text" aria-required="true"></div>
  <div><label for="ph">Phone Number<abbr title="required">*</abbr></label><input id="ph" type="tel" data-automation-id="phone-number" aria-required="true"></div>
  <div><label id="stl" for="st">State<abbr title="required">*</abbr></label>
    <button id="st" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="State Select One Required" data-automation-id="addressSection_countryRegion">Select One</button></div>
  <h2>Resume/CV</h2>
  <div><div data-automation-id="attachments-FileUpload"><input type="file" id="rf" data-automation-id="file-upload-input-ref"></div></div>
  <div data-automation-id="formField-q1"><fieldset><legend><b>Are you authorized to work legally in the United States?<abbr title="required">*</abbr></b></legend>
    <button id="q1" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label=" Select One Required">Select One</button></fieldset></div>
  <div data-automation-id="formField-q2"><fieldset><legend><b>Will you authorize such an investigation?<abbr title="required">*</abbr></b></legend>
    <button id="q2" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label=" Select One Required">Select One</button></fieldset></div>
  <div data-automation-id="formField-gen"><fieldset><legend><b>Gender</b></legend>
    <button id="gen" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label=" Select One Required">Select One</button></fieldset></div>
  <div data-automation-id="formField-rac"><fieldset><legend><b>Race</b></legend>
    <button id="rac" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label=" Select One Required">Select One</button></fieldset></div>
  <div data-automation-id="formField-vet"><fieldset><legend><b>Veteran Status</b></legend>
    <button id="vet" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label=" Select One Required">Select One</button></fieldset></div>
  <div class="footer"><button type="button" data-automation-id="pageFooterNextButton" id="next">Save and Continue</button></div>
</form>
<ul role="listbox" id="pop" hidden></ul>
<script>
  window.__nextClicks = 0; window.__submitted = 0;
  document.getElementById('next').addEventListener('click', () => window.__nextClicks++);
  document.getElementById('app').addEventListener('submit', e => { e.preventDefault(); window.__submitted++; });
  const sets = {
    pdt: ['Select One', 'Landline', 'Mobile'],
    cpc: ['Afghanistan (+93)', 'United Kingdom (+44)', 'United States of America (+1)'],
    st: ['Massachusetts', 'New York'],
    gen: ['Select One','Female','Male','Prefer Not to Identify'],
    rac: ['Select One','American Indian or Alaska Native (Not Hispanic or Latino) (United States of America)','Asian (Not Hispanic or Latino) (United States of America)','Black or African American (Not Hispanic or Latino) (United States of America)','Hispanic or Latino (United States of America)','Native Hawaiian or Other Pacific Islander (Not Hispanic or Latino) (United States of America)','Prefer Not to Identify (United States of America)','Two or More Races (Not Hispanic or Latino) (United States of America)','White (Not Hispanic or Latino) (United States of America)'],
    vet: ['Select One','o I identify as one or more of the classifications of protected veterans listed above.','o I am not a protected veteran in any of the categories above.','o I choose not to self-identity as a protected veteran.'],
    q1: ['Yes', 'No'],
    q2: ['Yes', 'No'],
  };
  const pop = document.getElementById('pop'); let open = null;
  function close() { if (open) open.setAttribute('aria-expanded', 'false'); pop.hidden = true; pop.innerHTML = ''; open = null; }
  document.querySelectorAll('button[aria-haspopup]').forEach(b => b.addEventListener('click', () => {
    if (open === b) return close(); close(); open = b; b.setAttribute('aria-expanded', 'true');
    sets[b.id].forEach(t => { const li = document.createElement('li'); li.setAttribute('role', 'option'); li.textContent = t;
      li.addEventListener('click', () => { b.textContent = t; close(); }); pop.appendChild(li); });
    pop.hidden = false;
  }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
</script></body></html>
